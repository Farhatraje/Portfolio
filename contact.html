<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#020617;
  color:white;
  cursor:none;
}

/* PARTICLES */
#particles-js{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
}

/* CURSOR */
.cursor{
  width:20px;
  height:20px;
  border:2px solid #38bdf8;
  border-radius:50%;
  position:fixed;
  pointer-events:none;
  z-index:1000;
  box-shadow:0 0 20px #38bdf8;
}

/* TRAIL */
.trail{
  position: fixed;
  width: 8px;
  height: 8px;
  background: #38bdf8;
  border-radius: 50%;
  pointer-events: none;
  z-index: 999;
  opacity: 0.8;
  box-shadow: 0 0 10px #38bdf8;
  transition: transform 0.2s, opacity 0.5s;
}

/* NAV */
nav{
  display:flex;
  justify-content:center;
  gap:40px;
  padding:20px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
}

nav a{
  color:white;
  text-decoration:none;
}

/* TITLE */
.title{
  text-align:center;
  margin-top:80px;
}

.title h1{
  color:#38bdf8;
}

/* CONTACT BOX */
.contact-container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:30px;
  padding:50px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  padding:25px;
  border-radius:15px;
  width:300px;
  text-align:center;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-10px);
  box-shadow:0 0 20px #38bdf8;
}

/* FORM */
form input, form textarea{
  width:100%;
  padding:10px;
  margin:10px 0;
  border:none;
  border-radius:5px;
}

textarea{
  height:100px;
}

/* BUTTON */
.btn{
  padding:10px 20px;
  background:#38bdf8;
  border:none;
  border-radius:20px;
  cursor:pointer;
  color:black;              /* ✅ FIX */
  text-decoration:none;     /* ✅ REMOVE UNDERLINE */
  display:inline-block;
}

.btn:hover{
  box-shadow:0 0 15px #38bdf8;
}

.icon{
  animation: glow 2s infinite alternate;
}

@keyframes glow{
  from{
    text-shadow:0 0 5px #38bdf8;
  }
  to{
    text-shadow:0 0 20px #38bdf8;
  }
}

.card:hover .icon{
  transform:scale(1.2);
  transition:0.3s;
}

.whatsapp{
  position:fixed;
  bottom:25px;
  right:25px;
  width:55px;
  height:55px;
  background:#38bdf8;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:24px;
  text-decoration:none;
  z-index:1000;
  box-shadow:0 0 20px #38bdf8;
  animation:pulse 2s infinite;
  transition:0.3s;
}

/* HOVER */
.whatsapp:hover{
  transform:scale(1.15);
  box-shadow:0 0 30px #38bdf8;
}

/* PULSE ANIMATION */
@keyframes pulse{
  0%{
    box-shadow:0 0 0 0 #38bdf8;
  }
  70%{
    box-shadow:0 0 0 15px rgba(37,211,102,0);
  }
  100%{
    box-shadow:0 0 0 0 rgba(37,211,102,0);
  }
}

/* FOOTER */
.footer{
  text-align:center;
  padding:30px 20px;
  background:#020617;
  margin-top:50px;
}

/* NAME */
.footer h3{
  color:#38bdf8;
}
/* TEXT */
.footer p{
  color:#94a3b8;
  margin:10px 0;
}

/* SOCIAL LINKS */
.socials{
  margin:15px 0;
}

.socials a{
  margin:0 10px;
  color:#38bdf8;
  text-decoration:none;
  transition:0.3s;
}

.socials a:hover{
  text-shadow:0 0 10px #38bdf8;
}

/* COPYRIGHT */
.copy{
  font-size:14px;
  margin-top:10px;
}
</style>
</head>

<script>
// PARTICLES

  particles: {
    number: { value: 80 },
    size: { value: 3 },
    move: { speed: 1 },
    line_linked: { enable: true }
  }
});

// CURSOR + TRAIL
const cursor = document.querySelector('.cursor');

document.addEventListener('mousemove', e => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top = e.clientY + 'px';

  const trail = document.createElement("div");
  trail.className = "trail";
  document.body.appendChild(trail);

  trail.style.left = e.clientX + "px";
  trail.style.top = e.clientY + "px";

  setTimeout(() => {
    trail.style.transform = "scale(0)";
    trail.style.opacity = "0";
  }, 10);

  setTimeout(() => {
    trail.remove();
  }, 300);
});
</script>
